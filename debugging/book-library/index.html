<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>

    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
    >
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <div class="jumbotron text-center">
      <h1>Library</h1>
      <p>Add books to your virtual library</p>
    </div>

    <button data-toggle="collapse" data-target="#demo" class="btn btn-info">
      Add new book
    </button>

    <div id="demo" class="collapse mt-3">
      <form id="book-form" class="form-group">
        <label for="title">Title:</label>
        <input
          type="text"
          class="form-control"
          id="title"
          name="title"
          required
        >

        <label for="author" class="mt-2">Author:</label>
        <input
          type="text"
          class="form-control"
          id="author"
          name="author"
          required
        >

        <label for="pages" class="mt-2">Pages:</label>
        <input
          type="number"
          class="form-control"
          id="pages"
          name="pages"
          required
        >

        <div class="form-check mt-2">
          <input
            type="checkbox"
            class="form-check-input"
            id="check"
          >
          <label class="form-check-label" for="check">Read</label>
        </div>

        <button type="submit" class="btn btn-primary mt-3">
          Submit
        </button>
      </form>
    </div>

    <table class="table mt-4" id="display">
      <thead class="thead-dark">
        <tr>
          <th>Title</th>
          <th>Author</th>
          <th>Number of Pages</th>
          <th>Read</th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <script type="module" src="script.js"></script>
  </body>
</html>
